<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Search{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
    line-height: 1.5;
  }
  nav {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid #d0d0d0;
    padding-bottom: 0.75rem;
  }
  nav a {
    text-decoration: none;
    color: inherit;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
  }
  nav a.active { background: #2563eb; color: white; }
  .search-box {
    width: 100%;
    padding: 0.6rem;
    font-size: 1rem;
    margin-bottom: 1rem;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .job {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 0.75rem;
  }
  .job h3 { margin: 0 0 0.25rem 0; }
  .job .meta { color: #666; font-size: 0.9rem; margin-bottom: 0.5rem; }
  .job .fields { display: flex; flex-wrap: wrap; gap: 0.4rem; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .job .fields span { background: rgba(127,127,127,0.15); padding: 0.15rem 0.5rem; border-radius: 4px; }
  .job .reason { color: #555; font-size: 0.9rem; margin: 0.25rem 0; }
  .job .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .job .actions button {
    cursor: pointer;
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: transparent;
    font: inherit;
  }
  .starred { color: #d97706; }
  .correct-form { display: flex; gap: 0.4rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .correct-form select, .correct-form input[type=text] {
    padding: 0.3rem;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  tr.unhealthy { background: rgba(220,38,38,0.08); }
  .empty { color: #777; }
</style>
</head>
<body>
<nav>
  <a href="/jobs/saved" class="{{ 'active' if active_tab == 'saved' else '' }}">Saved Sources</a>
  <a href="/jobs/openweb" class="{{ 'active' if active_tab == 'openweb' else '' }}">Open Web</a>
  <a href="/sources" class="{{ 'active' if active_tab == 'sources' else '' }}">Source Health</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
